<!DOCTYPE html>
<html lang="es" translate="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google" content="notranslate">

  <title>Febr0n Streamer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>

    <h1>FEBR0N</h1>

    <nav>
      <ul>

        <li><a href="#inicio">Inicio</a></li>

        <li><a href="#directos">Directos</a></li>

        <li><a href="#fotos">Fotos</a></li>

        <li><a href="#musica">Música</a></li>

        <li><a href="#clips">Clips</a></li>

      </ul>
    </nav>

  </header>

  <!-- INICIO -->
  <section id="inicio" class="seccion">

    <div class="inicio-container">

      <div class="inicio-info">

        <h2>FEBR0N</h2>

        <p class="descripcion">
          Streamer • Gaming • Música • Comunidad
        </p>

        <div class="redes">

          <a href="https://www.twitch.tv/febr0n" target="_blank">
            🎮 Twitch
          </a>

          <a href="https://www.instagram.com/febr0n?igsh=MTNnN3VkeDR5NmlqNQ==" target="_blank">
            📸 Instagram
          </a>

          <a href="https://open.spotify.com/intl-es/artist/44qrZknzV3P8bezdQ1Wc48?si=8bd1880260dc40a2" target="_blank">
            🎵 Spotify
          </a>

          <a href="https://www.tiktok.com/@febr0n" target="_blank">
            🎬 TikTok
          </a>

          <a href="https://www.youtube.com/@febr0nn" target="_blank">
            ▶ YouTube
          </a>

          <a href="#">
            💬 Discord
          </a>

        </div>

      </div>

      <div class="inicio-foto">

        <img
          id="fotoStreamer"
          src="https://i.ytimg.com/vi/Y5-s97eew6c/maxresdefault.jpg"
          class="foto-real">

      </div>

    </div>

  </section>

  <!-- DIRECTOS -->
  <section id="directos" class="seccion">

    <h2>🔴 Directos</h2>

    <div class="card">

      <iframe
        src="https://player.twitch.tv/?channel=febr0n&parent=cdpn.io"
        frameborder="0"
        allowfullscreen="true"
        scrolling="no"
        height="500"
        width="100%">
      </iframe>

    </div>

  </section>

  <!-- FOTOS -->
  <section id="fotos" class="seccion">

    <h2>📸 Fotos</h2>

    <div class="galeria">

      <img src="https://i.ytimg.com/vi/Y5-s97eew6c/maxresdefault.jpg">

      <img src="https://i.ytimg.com/vi/Y5-s97eew6c/maxresdefault.jpg">

      <img src="https://i.ytimg.com/vi/Y5-s97eew6c/maxresdefault.jpg">

      <img src="https://i.ytimg.com/vi/Y5-s97eew6c/maxresdefault.jpg">

    </div>

  </section>

  <!-- MÚSICA -->
  <section id="musica" class="seccion">

    <h2>🎵 Música en Spotify</h2>

    <div class="card">

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/artist/44qrZknzV3P8bezdQ1Wc48"
        width="100%"
        height="500"
        frameborder="0"
        allowfullscreen=""
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
      </iframe>

    </div>

  </section>

  <!-- CLIPS -->
  <section id="clips" class="seccion">

    <h2>🎬 Clips</h2>

    <div class="clips-container">

      <div class="clip">

        <iframe
          src="https://clips.twitch.tv/embed?clip=AgileRamshackleMeerkatKappaRoss&parent=cdpn.io"
          height="300"
          width="100%"
          allowfullscreen>
        </iframe>

      </div>

      <div class="clip">

        <iframe
          src="https://clips.twitch.tv/embed?clip=FunnySavageClamDxCat&parent=cdpn.io"
          height="300"
          width="100%"
          allowfullscreen>
        </iframe>

      </div>

    </div>

  </section>

  <script src="script.js"></script>

</body>
</html>
